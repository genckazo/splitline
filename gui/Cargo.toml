[package]
name = "splitline-gui"
version = "0.1.0"
edition = "2021"
description = "SplitLine desktop app (GPUI) — one line for the game, one line for everything else."
license = "LicenseRef-Proprietary"

[dependencies]
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
