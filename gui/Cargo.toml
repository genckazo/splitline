[package]
name = "splitline-gui"
version = "0.1.0"
edition = "2021"
description = "SplitLine desktop app (GPUI) — one line for the game, one line for everything else."
license = "LicenseRef-Proprietary"

[dependencies]
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

# `zed-async-tar` (inside GPUI 0.2's tree) pins `xattr = "0.2"`, whose 0.2.3
# release no longer compiles against current `libc` on Linux (ENOATTR was
# removed; on Linux it is ENODATA). The vendored copy in vendor/xattr is
# upstream 0.2.3 with exactly that one-line-class fix. Remove both the patch
# and the vendor directory once the tree builds without it.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
